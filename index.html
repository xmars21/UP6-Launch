<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnifyDrive UP6 Media Launch Dashboard</title>
    <!-- React Core -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Fade in animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Inline Icons (No external dependencies) ---
        const Icon = ({ path, size = 18, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {path}
            </svg>
        );

        const Icons = {
            BarChart3: (props) => <Icon {...props} path={<><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></>} />,
            Users: (props) => <Icon {...props} path={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>} />,
            Mail: (props) => <Icon {...props} path={<><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></>} />,
            FileText: (props) => <Icon {...props} path={<><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></>} />,
            RefreshCw: (props) => <Icon {...props} path={<><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></>} />,
            Clipboard: (props) => <Icon {...props} path={<><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></>} />,
            CheckCircle2: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>} />,
            ExternalLink: (props) => <Icon {...props} path={<><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></>} />
        };

        // --- Data & Constants ---

        const INITIAL_TASKS = {
            prep: [
                { id: 'p1', text: '整理 Press Release (Word版，方便编辑复制)', checked: false },
                { id: 'p2', text: '制作 Spec Sheet (纯文本或Excel参数表)', checked: false },
                { id: 'p3', text: '准备产品主图 (Hero Shot - 屏幕亮起状态)', checked: false },
                { id: 'p4', text: '准备场景图 (Lifestyle - 户外/DIT工作流)', checked: false },
                { id: 'p5', text: '生成并测试 Pre-order 购买链接', checked: false },
                { id: 'p6', text: '打包所有文件上传至 Google Drive/Dropbox', checked: false },
            ],
            outreach: [
                { id: 'o1', text: '向 PR Agency 确认/索要最新的 Media List', checked: false },
                { id: 'o2', text: '确认所有邮件主题 (Subject Line) 已包含新闻点', checked: false },
                { id: 'o3', text: '发送第一轮 "News Blast" 邮件', checked: false },
                { id: 'o4', text: '3-5天后跟进 (Follow-up) 未回复的 VIP 媒体', checked: false },
                { id: 'o5', text: '安排评测样机寄送 (针对回复意向的媒体)', checked: false },
            ]
        };

        const MEDIA_LIST = [
            { id: 1, name: 'NAS Compares', contact: 'Robbie', email: 'robbie@nascompares.com', type: 'Tech/Hardcore', note: '侧重性能/拆解，大概率出视频', status: 'pending' },
            { id: 2, name: 'PetaPixel', contact: 'Jaron Schneider', email: 'editor@petapixel.com', type: 'Photo/Creative', note: '上次批评过体验，强调屏幕改进', status: 'pending' },
            { id: 3, name: 'Liliputing', contact: 'Brad Linder', email: 'editor@liliputing.com', type: 'Tech/Geek', note: '发新闻很快，强调Mini PC属性', status: 'pending' },
            { id: 4, name: 'TechPowerUp', contact: 'Press Team', email: 'press@techpowerup.com', type: 'Tech/News', note: '必发的新闻通稿站点', status: 'pending' },
            { id: 5, name: 'NotebookCheck', contact: 'Codrut Nistor', email: 'press@notebookcheck.net', type: 'Tech/News', note: '关注新品Launch消息', status: 'pending' },
            { id: 6, name: 'Macworld', contact: 'Jon Jacobi', email: 'news@macworld.com', type: 'Photo/Workflow', note: '关注雷电4和苹果生态', status: 'pending' },
            { id: 7, name: 'Fstoppers', contact: 'Ivor Rackham', email: '(需查找/表单)', type: 'Photo/Creative', note: '侧重现场备份工作流', status: 'pending' },
            { id: 8, name: 'The Gadgeteer', contact: 'Julie Strietelmeier', email: 'julie@the-gadgeteer.com', type: 'Gadget/Review', note: '侧重综合体验', status: 'pending' },
        ];

        const TEMPLATES = {
            tech: {
                title: '针对硬件/参数党 (Tech/Specs)',
                subject: '[NEWS] UnifyDrive UP6 Launches: The First Portable NAS with Intel Core Ultra 5 & 6" Screen',
                body: `Hi [Name],

Following your coverage of the UT2, I wanted to share some breaking news that I think your readers will love.

We have just officially launched the **UnifyDrive UP6**—a massive leap in performance for portable storage—and **Pre-orders are now live**.

Unlike the UT2, the UP6 is a true mobile workstation powerhouse featuring:
* **Intel Core Ultra 5 125H Processor**
* **6x M.2 NVMe Slots (Up to 96TB)**
* **Dual Thunderbolt 4 + 10GbE Connectivity**
* **Built-in 6-inch Touchscreen** for standalone control

**[The Ask]**
Could you share this launch news with your audience?

You can find the **official Press Release, Spec Sheet, and High-Res Images** here: [INSERT PRESS KIT LINK]

Let me know if you need any specific details for the write-up.

Best,

[Your Name]
UnifyDrive Team`
            },
            photo: {
                title: '针对摄影/体验党 (Photo/Creative)',
                subject: '[Launch News] UnifyDrive UP6: A Portable NAS Designed to Fix On-Set Backups',
                body: `Hi [Name],

I’m writing to let you know that the successor to the UT2—the **UnifyDrive UP6**—is now officially available for Pre-order.

We built this device specifically based on feedback from the photography community (including your review). The UP6 addresses the need for a **standalone workflow** without relying on mobile apps.

**Key News Highlights:**
* **No Phone Needed:** Features a built-in **6-inch touchscreen** to preview and manage files instantly.
* **Pro Speed:** Equipped with **Thunderbolt 4** and **CFexpress Type B** support for DIT-level transfer speeds.
* **Desktop Power:** Powered by the **Intel Core Ultra 5**.

**[The Ask]**
We would love for you to cover the launch news for your readers.

**Link to Press Kit (Images & PR):** [INSERT PRESS KIT LINK]

Thanks for your continued support!

Best,

[Your Name]
UnifyDrive Team`
            }
        };

        // --- Components ---

        const ProgressBar = ({ progress }) => (
            <div className="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                <div className="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style={{ width: `${progress}%` }}></div>
                <div className="text-right text-xs text-gray-500 mt-1">{Math.round(progress)}% 完成度</div>
            </div>
        );

        const StatusBadge = ({ status }) => {
            const styles = {
                pending: 'bg-gray-100 text-gray-800',
                emailed: 'bg-yellow-100 text-yellow-800',
                replied: 'bg-green-100 text-green-800',
                declined: 'bg-red-100 text-red-800'
            };
            const labels = {
                pending: '待联系',
                emailed: '已发送',
                replied: '已回复',
                declined: '无意向'
            };
            return (
                <span className={`px-2 py-1 rounded-full text-xs font-medium ${styles[status] || styles.pending}`}>
                    {labels[status]}
                </span>
            );
        };

        const CopyButton = ({ text }) => {
            const [copied, setCopied] = useState(false);
            const handleCopy = () => {
                navigator.clipboard.writeText(text);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };
            return (
                <button 
                    onClick={handleCopy}
                    className={`flex items-center gap-1 text-xs px-2 py-1 rounded border transition-colors ${copied ? 'bg-green-50 border-green-200 text-green-700' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}`}
                >
                    {copied ? <Icons.CheckCircle2 size={12} /> : <Icons.Clipboard size={12} />}
                    {copied ? 'Copied!' : 'Copy'}
                </button>
            );
        };

        // --- Main App ---

        function App() {
            // State
            const [activeTab, setActiveTab] = useState('dashboard');
            const [tasks, setTasks] = useState(INITIAL_TASKS);
            const [mediaContacts, setMediaContacts] = useState(MEDIA_LIST);

            // Load from LocalStorage on mount
            useEffect(() => {
                try {
                    const savedTasks = localStorage.getItem('up6_tasks');
                    const savedMedia = localStorage.getItem('up6_media');
                    if (savedTasks) setTasks(JSON.parse(savedTasks));
                    if (savedMedia) setMediaContacts(JSON.parse(savedMedia));
                } catch(e) {
                    console.error("Storage load error", e);
                }
            }, []);

            // Save to LocalStorage on change
            useEffect(() => {
                localStorage.setItem('up6_tasks', JSON.stringify(tasks));
            }, [tasks]);

            useEffect(() => {
                localStorage.setItem('up6_media', JSON.stringify(mediaContacts));
            }, [mediaContacts]);

            // Handlers
            const toggleTask = (category, id) => {
                setTasks(prev => ({
                    ...prev,
                    [category]: prev[category].map(t => t.id === id ? { ...t, checked: !t.checked } : t)
                }));
            };

            const updateMediaStatus = (id, newStatus) => {
                setMediaContacts(prev => prev.map(m => m.id === id ? { ...m, status: newStatus } : m));
            };

            const resetData = () => {
                if(confirm('确定要重置所有进度吗？此操作无法撤销。')) {
                    setTasks(INITIAL_TASKS);
                    setMediaContacts(MEDIA_LIST);
                    localStorage.removeItem('up6_tasks');
                    localStorage.removeItem('up6_media');
                }
            };

            // Calculation
            const totalTasks = tasks.prep.length + tasks.outreach.length + mediaContacts.length;
            const completedTasks = 
                tasks.prep.filter(t => t.checked).length + 
                tasks.outreach.filter(t => t.checked).length + 
                mediaContacts.filter(m => m.status !== 'pending').length;
            const progress = (completedTasks / totalTasks) * 100;

            // Render Functions
            const renderDashboard = () => (
                <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 className="text-gray-500 text-sm font-medium">准备工作</h3>
                            <div className="text-2xl font-bold mt-2 text-gray-800">
                                {tasks.prep.filter(t => t.checked).length}/{tasks.prep.length}
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 className="text-gray-500 text-sm font-medium">媒体联络进度</h3>
                            <div className="text-2xl font-bold mt-2 text-gray-800">
                                {mediaContacts.filter(m => m.status === 'emailed').length}/{mediaContacts.length} <span className="text-sm font-normal text-gray-400">已发送</span>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 className="text-gray-500 text-sm font-medium">总进度</h3>
                            <div className="text-2xl font-bold mt-2 text-blue-600">{Math.round(progress)}%</div>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                        <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                            <Icons.FileText size={20} className="text-blue-500"/> Press Kit 准备清单
                        </h2>
                        <div className="space-y-3">
                            {tasks.prep.map(task => (
                                <label key={task.id} className="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-lg cursor-pointer transition-colors">
                                    <input 
                                        type="checkbox" 
                                        checked={task.checked} 
                                        onChange={() => toggleTask('prep', task.id)}
                                        className="w-5 h-5 text-blue-600 rounded focus:ring-blue-500"
                                    />
                                    <span className={task.checked ? "text-gray-400 line-through" : "text-gray-700"}>{task.text}</span>
                                </label>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderMediaList = () => (
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div className="p-6 border-b border-gray-100 flex justify-between items-center">
                        <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                            <Icons.Users size={20} className="text-blue-500"/> 媒体联络表 (CRM)
                        </h2>
                        <div className="text-sm text-gray-500">
                            共 {mediaContacts.length} 家媒体
                        </div>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left text-sm">
                            <thead className="bg-gray-50 text-gray-500 uppercase">
                                <tr>
                                    <th className="px-6 py-4 font-medium">媒体/编辑</th>
                                    <th className="px-6 py-4 font-medium">类型/策略</th>
                                    <th className="px-6 py-4 font-medium">邮箱</th>
                                    <th className="px-6 py-4 font-medium">状态</th>
                                    <th className="px-6 py-4 font-medium">操作</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {mediaContacts.map(media => (
                                    <tr key={media.id} className="hover:bg-gray-50 transition-colors">
                                        <td className="px-6 py-4">
                                            <div className="font-bold text-gray-900">{media.name}</div>
                                            <div className="text-gray-500 text-xs">{media.contact}</div>
                                        </td>
                                        <td className="px-6 py-4">
                                            <span className="inline-block px-2 py-0.5 rounded text-xs bg-blue-50 text-blue-700 mb-1">{media.type}</span>
                                            <div className="text-gray-400 text-xs truncate max-w-[200px]" title={media.note}>{media.note}</div>
                                        </td>
                                        <td className="px-6 py-4">
                                            <div className="flex items-center gap-2">
                                                <span className="font-mono text-gray-600 select-all">{media.email}</span>
                                                <CopyButton text={media.email} />
                                            </div>
                                        </td>
                                        <td className="px-6 py-4">
                                            <StatusBadge status={media.status} />
                                        </td>
                                        <td className="px-6 py-4">
                                            <select 
                                                value={media.status}
                                                onChange={(e) => updateMediaStatus(media.id, e.target.value)}
                                                className="border border-gray-200 rounded text-xs py-1 px-2 focus:ring-blue-500 focus:border-blue-500"
                                            >
                                                <option value="pending">待处理</option>
                                                <option value="emailed">已发送</option>
                                                <option value="replied">已回复</option>
                                                <option value="declined">无意向</option>
                                            </select>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            const renderTemplates = () => (
                <div className="space-y-6">
                    {Object.entries(TEMPLATES).map(([key, template]) => (
                        <div key={key} className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                            <div className="p-4 bg-gray-50 border-b border-gray-100 flex justify-between items-center">
                                <h3 className="font-bold text-gray-700 flex items-center gap-2">
                                    {key === 'tech' ? <Icons.Mail size={18} className="text-blue-500"/> : <Icons.Mail size={18} className="text-purple-500"/>}
                                    {template.title}
                                </h3>
                                <CopyButton text={`${template.subject}\n\n${template.body}`} />
                            </div>
                            <div className="p-6 space-y-4">
                                <div>
                                    <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Subject</div>
                                    <div className="bg-gray-50 p-3 rounded border border-gray-200 text-sm font-medium text-gray-800 flex justify-between items-center group">
                                        {template.subject}
                                        <div className="opacity-0 group-hover:opacity-100 transition-opacity">
                                            <CopyButton text={template.subject} />
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Body</div>
                                    <div className="relative group">
                                        <textarea 
                                            readOnly 
                                            className="w-full h-64 p-4 bg-gray-50 border border-gray-200 rounded text-sm text-gray-600 font-mono resize-none focus:outline-none"
                                            value={template.body}
                                        ></textarea>
                                        <div className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity bg-white shadow-sm rounded">
                                             <CopyButton text={template.body} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    {/* Sidebar */}
                    <aside className="w-full md:w-64 bg-white border-r border-gray-200 flex-shrink-0">
                        <div className="p-6 border-b border-gray-100">
                            <h1 className="text-xl font-bold text-gray-900 tracking-tight">UP6 Launch <span className="text-blue-600">Hub</span></h1>
                            <p className="text-xs text-gray-500 mt-1">Media Relations Center</p>
                        </div>
                        <nav className="p-4 space-y-1">
                            <button 
                                onClick={() => setActiveTab('dashboard')}
                                className={`w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'dashboard' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}
                            >
                                <Icons.BarChart3 size={18} /> 总览 & 准备
                            </button>
                            <button 
                                onClick={() => setActiveTab('media')}
                                className={`w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'media' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}
                            >
                                <Icons.Users size={18} /> 媒体联络表
                            </button>
                            <button 
                                onClick={() => setActiveTab('templates')}
                                className={`w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'templates' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}
                            >
                                <Icons.Mail size={18} /> 邮件模板
                            </button>
                        </nav>
                        
                        <div className="p-4 mt-auto">
                            <div className="bg-blue-50 rounded-lg p-4">
                                <h4 className="text-xs font-bold text-blue-800 uppercase mb-2">执行 Tips</h4>
                                <p className="text-xs text-blue-600 leading-relaxed">
                                    务必记得将邮件模板中的 <strong>[Link]</strong> 替换为您实际的 Google Drive 链接。
                                </p>
                            </div>
                            <button onClick={resetData} className="mt-4 w-full flex items-center justify-center gap-2 text-xs text-gray-400 hover:text-red-500 transition-colors">
                                <Icons.RefreshCw size={12} /> 重置所有数据
                            </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto custom-scrollbar h-screen">
                        <header className="bg-white border-b border-gray-200 px-8 py-5 sticky top-0 z-10 shadow-sm md:hidden">
                             <h1 className="text-lg font-bold text-gray-900">UnifyDrive UP6 Launch</h1>
                        </header>
                        
                        <div className="p-4 md:p-8 max-w-5xl mx-auto">
                            <div className="mb-8">
                                <h2 className="text-2xl font-bold text-gray-900 mb-2">
                                    {activeTab === 'dashboard' && '任务总览 & 准备'}
                                    {activeTab === 'media' && '媒体联络管理 (CRM)'}
                                    {activeTab === 'templates' && 'Pitch 邮件模板'}
                                </h2>
                                <ProgressBar progress={progress} />
                            </div>

                            <div className="animate-fade-in">
                                {activeTab === 'dashboard' && renderDashboard()}
                                {activeTab === 'media' && renderMediaList()}
                                {activeTab === 'templates' && renderTemplates()}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
