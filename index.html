        const TEMPLATES = {

UnifyDrive Team`
            },
            photo: {
                title: '针对摄影/体验党 (Photo/Creative)',
                subject: '[Launch News] UnifyDrive UP6: A Portable NAS Designed to Fix On-Set Backups',
                body: `Hi [Name],

I’m writing to let you know that the successor to the UT2—the **UnifyDrive UP6**—is now officially available for Pre-order.

We built this device specifically based on feedback from the photography community (including your review). The UP6 addresses the need for a **standalone workflow** without relying on mobile apps.

**Key News Highlights:**

        // --- Components ---

        const ProgressBar = ({ progress }) => (
            <div className="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                <div className="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style={{ width: `${progress}%` }}></div>
                <div className="text-right text-xs text-gray-500 mt-1">{Math.round(progress)}% 完成度</div>
            </div>
        );

        const StatusBadge = ({ status }) => {
            const styles = {
                pending: 'bg-gray-100 text-gray-800',
                emailed: 'bg-yellow-100 text-yellow-800',
                replied: 'bg-green-100 text-green-800',
                declined: 'bg-red-100 text-red-800'
            };
            const labels = {
                pending: '待联系',
                emailed: '已发送',
                replied: '已回复',
                declined: '无意向'
            };
            return (
                <span className={`px-2 py-1 rounded-full text-xs font-medium ${styles[status] || styles.pending}`}>
                    {labels[status]}
                </span>
            );
        };

        const CopyButton = ({ text }) => {
            const [copied, setCopied] = useState(false);
            const handleCopy = () => {
                navigator.clipboard.writeText(text);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };
            return (
                <button 
                    onClick={handleCopy}
                    className={`flex items-center gap-1 text-xs px-2 py-1 rounded border transition-colors ${copied ? 'bg-green-50 border-green-200 text-green-700' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}`}
                >
                    {copied ? <Icons.CheckCircle2 size={12} /> : <Icons.Clipboard size={12} />}
                    {copied ? 'Copied!' : 'Copy'}
                </button>
            );
        };

        // --- Main App ---

        function App() {
            // State
            const [activeTab, setActiveTab] = useState('dashboard');
            const [tasks, setTasks] = useState(INITIAL_TASKS);
            const [mediaContacts, setMediaContacts] = useState(MEDIA_LIST);
            const [showAddModal, setShowAddModal] = useState(false);
            const [editingId, setEditingId] = useState(null); // ID of contact being edited
            const [newContact, setNewContact] = useState({ name: '', contact: '', email: '', type: 'Tech/News', note: '', ut2_article: '', ut2_title: '' });

            // Load from LocalStorage on mount
            useEffect(() => {
                try {
                    const savedTasks = localStorage.getItem('up6_tasks');
                    const savedMedia = localStorage.getItem('up6_media');
                    if (savedTasks) setTasks(JSON.parse(savedTasks));
                    
                    if (savedMedia) {
                         const localMedia = JSON.parse(savedMedia);
                         // Smart merge: Keep local status, update info from server constant
                         const mergedMedia = MEDIA_LIST.map(serverItem => {
                             const localItem = localMedia.find(l => l.id === serverItem.id);
                             return localItem ? { ...serverItem, status: localItem.status } : serverItem;
                         });
                         // Append custom added contacts
                         const customContacts = localMedia.filter(l => l.id > 13);
                         setMediaContacts([...mergedMedia, ...customContacts]);
                    } else {
                        setMediaContacts(MEDIA_LIST);
                    }
                } catch(e) {
                    console.error("Storage load error", e);
                    setMediaContacts(MEDIA_LIST);
                }
            }, []);

            // Save to LocalStorage on change
            useEffect(() => {
                localStorage.setItem('up6_tasks', JSON.stringify(tasks));
            }, [tasks]);

            useEffect(() => {
                localStorage.setItem('up6_media', JSON.stringify(mediaContacts));
            }, [mediaContacts]);

            // Handlers
            const toggleTask = (category, id) => {
                setTasks(prev => ({
                    ...prev,
                    [category]: prev[category].map(t => t.id === id ? { ...t, checked: !t.checked } : t)
                }));
            };

            const updateMediaStatus = (id, newStatus) => {
                setMediaContacts(prev => prev.map(m => m.id === id ? { ...m, status: newStatus } : m));
            };

            const openEditModal = (contact) => {
                setNewContact(contact);
                setEditingId(contact.id);
                setShowAddModal(true);
            };

            const openAddModal = () => {
                setNewContact({ name: '', contact: '', email: '', type: 'Tech/News', note: '', ut2_article: '', ut2_title: '' });
                setEditingId(null);
                setShowAddModal(true);
            };

            const handleAddOrUpdateContact = (e) => {
                e.preventDefault();
                if (!newContact.name) {
                    alert('请至少填写媒体名称');
                    return;
                }

                if (editingId) {
                    // Update existing
                    setMediaContacts(prev => prev.map(c => c.id === editingId ? { ...newContact, id: editingId, status: c.status } : c));
                } else {
                    // Add new
                    const newId = mediaContacts.length > 0 ? Math.max(...mediaContacts.map(m => m.id)) + 1 : 1;
                    const contactToAdd = {
                        id: newId,
                        ...newContact,
                        status: 'pending'
                    };
                    setMediaContacts([...mediaContacts, contactToAdd]);
                }
                
                setShowAddModal(false);
                setEditingId(null);
                setNewContact({ name: '', contact: '', email: '', type: 'Tech/News', note: '', ut2_article: '', ut2_title: '' });
            };

            const resetData = () => {
                if(confirm('确定要重置所有进度吗？此操作将恢复默认列表（包含最新的UT2链接）。')) {
                    setTasks(INITIAL_TASKS);
                    setMediaContacts(MEDIA_LIST);
                    localStorage.removeItem('up6_tasks');
                    localStorage.removeItem('up6_media');
                }
            };

            // Calculation
            const totalTasks = tasks.prep.length + tasks.outreach.length + mediaContacts.length;
            const completedTasks = 
                tasks.prep.filter(t => t.checked).length + 
                tasks.outreach.filter(t => t.checked).length + 
                mediaContacts.filter(m => m.status !== 'pending').length;
            const progress = (completedTasks / totalTasks) * 100;

            // Render Functions
            const renderDashboard = () => (
                <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 className="text-gray-500 text-sm font-medium">准备工作</h3>
                            <div className="text-2xl font-bold mt-2 text-gray-800">
                                {tasks.prep.filter(t => t.checked).length}/{tasks.prep.length}
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 className="text-gray-500 text-sm font-medium">媒体联络进度</h3>
                            <div className="text-2xl font-bold mt-2 text-gray-800">
                                {mediaContacts.filter(m => m.status === 'emailed').length}/{mediaContacts.length} <span className="text-sm font-normal text-gray-400">已发送</span>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 className="text-gray-500 text-sm font-medium">总进度</h3>
                            <div className="text-2xl font-bold mt-2 text-blue-600">{Math.round(progress)}%</div>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                        <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                            <Icons.FileText size={20} className="text-blue-500"/> Press Kit 准备清单
                        </h2>
                        <div className="space-y-3">
                            {tasks.prep.map(task => (
                                <label key={task.id} className="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-lg cursor-pointer transition-colors">
                                    <input 
                                        type="checkbox" 
                                        checked={task.checked} 
                                        onChange={() => toggleTask('prep', task.id)}
                                        className="w-5 h-5 text-blue-600 rounded focus:ring-blue-500"
                                    />
                                    <span className={task.checked ? "text-gray-400 line-through" : "text-gray-700"}>{task.text}</span>
                                </label>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderMediaList = () => (

                        </h2>
                        <div className="flex items-center gap-4">
                             <div className="text-sm text-gray-500">
                                共 {mediaContacts.length} 家媒体
                            </div>
                            <button 
                                onClick={openAddModal}
                                className="flex items-center gap-1 bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors"
                            >
                                <Icons.Plus size={16} /> 添加媒体
                            </button>
                        </div>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left text-sm">
                            <thead className="bg-gray-50 text-gray-500 uppercase">
                                <tr>
                                    <th className="px-6 py-4 font-medium min-w-[180px]">媒体/编辑</th>
                                    <th className="px-6 py-4 font-medium min-w-[240px]">类型/策略</th>
                                    <th className="px-6 py-4 font-medium min-w-[150px]">UT2 报道</th>
                                    <th className="px-6 py-4 font-medium min-w-[220px]">邮箱</th>
                                    <th className="px-6 py-4 font-medium min-w-[120px]">状态</th>
                                    <th className="px-6 py-4 font-medium min-w-[140px]">操作</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {mediaContacts.map(media => (
                                    <tr key={media.id} className="hover:bg-gray-50 transition-colors">
                                        <td className="px-6 py-4">
                                            <div className="font-bold text-gray-900">{media.name}</div>
                                            <div className="text-gray-500 text-xs">{media.contact}</div>
                                        </td>
                                        <td className="px-6 py-4">
                                            <span className="inline-block px-2 py-0.5 rounded text-xs bg-blue-50 text-blue-700 mb-1">{media.type}</span>
                                            <div className="text-gray-400 text-xs text-wrap" title={media.note}>{media.note}</div>
                                        </td>
                                        <td className="px-6 py-4">
                                            {media.ut2_article ? (
                                                <a href={media.ut2_article} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:text-blue-800 flex items-center gap-1 text-xs font-medium" title={media.ut2_title || '查看文章'}>
                                                    <Icons.ExternalLink size={14} /> 
                                                    <span className="truncate max-w-[150px] inline-block align-bottom">{media.ut2_title || '查看文章'}</span>
                                                </a>
                                            ) : (
                                                <span className="text-gray-400 text-xs">-</span>
                                            )}
                                        </td>
                                        <td className="px-6 py-4">
                                            <div className="flex items-center gap-2">
                                                <span className="font-mono text-gray-600 select-all">{media.email}</span>
                                                <CopyButton text={media.email} />
                                            </div>
                                        </td>
                                        <td className="px-6 py-4">
                                            <StatusBadge status={media.status} />
                                        </td>
                                        <td className="px-6 py-4">
                                            <div className="flex items-center gap-2">
                                                <button 
                                                    onClick={() => openEditModal(media)}
                                                    className="p-1 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded transition-colors"
                                                    title="编辑信息"
                                                >
                                                    <Icons.Pencil size={16} />
                                                </button>
                                                <select 
                                                    value={media.status}
                                                    onChange={(e) => updateMediaStatus(media.id, e.target.value)}
                                                    className="border border-gray-200 rounded text-xs py-1 px-2 focus:ring-blue-500 focus:border-blue-500"
                                                >
                                                    <option value="pending">待处理</option>
                                                    <option value="emailed">已发送</option>
                                                    <option value="replied">已回复</option>
                                                    <option value="declined">无意向</option>
                                                </select>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            const renderTemplates = () => (
                <div className="space-y-6">
                    {Object.entries(TEMPLATES).map(([key, template]) => (
                        <div key={key} className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                            <div className="p-4 bg-gray-50 border-b border-gray-100 flex justify-between items-center">
                                <h3 className="font-bold text-gray-700 flex items-center gap-2">
                                    {key === 'tech' ? <Icons.Mail size={18} className="text-blue-500"/> : <Icons.Mail size={18} className="text-purple-500"/>}
                                    {template.title}
                                </h3>
                                <CopyButton text={`${template.subject}\n\n${template.body}`} />
                            </div>
                            <div className="p-6 space-y-4">
                                <div>
                                    <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Subject</div>
                                    <div className="bg-gray-50 p-3 rounded border border-gray-200 text-sm font-medium text-gray-800 flex justify-between items-center group">
                                        {template.subject}
                                        <div className="opacity-0 group-hover:opacity-100 transition-opacity">
                                            <CopyButton text={template.subject} />
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Body</div>
                                    <div className="relative group">
                                        <textarea 
                                            readOnly 
                                            className="w-full h-64 p-4 bg-gray-50 border border-gray-200 rounded text-sm text-gray-600 font-mono resize-none focus:outline-none"
                                            value={template.body}
                                        ></textarea>
                                        <div className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity bg-white shadow-sm rounded">
                                             <CopyButton text={template.body} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );

            const renderAddMediaModal = () => {
                if (!showAddModal) return null;
                return (
                    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                        <div className="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 animate-fade-in">
                            <div className="flex justify-between items-center p-6 border-b border-gray-100">
                                <h3 className="text-lg font-bold text-gray-900">{editingId ? '编辑媒体联系人' : '添加新媒体联系人'}</h3>
                                <button onClick={() => setShowAddModal(false)} className="text-gray-400 hover:text-gray-600">
                                    <Icons.X size={20} />
                                </button>
                            </div>
                            <form onSubmit={handleAddOrUpdateContact} className="p-6 space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">媒体名称 *</label>
                                    <input 
                                        type="text" 
                                        required
                                        className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                                        value={newContact.name}
                                        onChange={e => setNewContact({...newContact, name: e.target.value})}
                                        placeholder="例如: The Verge"
                                    />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">联系人</label>
                                        <input 
                                            type="text" 
                                            className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
                                            value={newContact.contact}
                                            onChange={e => setNewContact({...newContact, contact: e.target.value})}
                                            placeholder="例如: Nilay Patel"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">类型</label>
                                        <select 
                                            className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
                                            value={newContact.type}
                                            onChange={e => setNewContact({...newContact, type: e.target.value})}
                                        >
                                            <option value="Tech/News">Tech/News</option>
                                            <option value="Tech/Hardcore">Tech/Hardcore</option>
                                            <option value="Tech/Geek">Tech/Geek</option>
                                            <option value="Photo/Creative">Photo/Creative</option>
                                            <option value="Photo/Workflow">Photo/Workflow</option>
                                            <option value="Gadget/Review">Gadget/Review</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">UT2 文章标题</label>
                                        <input 
                                            type="text" 
                                            className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
                                            value={newContact.ut2_title}
                                            onChange={e => setNewContact({...newContact, ut2_title: e.target.value})}
                                            placeholder="文章标题..."
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">UT2 报道链接</label>
                                        <input 
                                            type="url" 
                                            className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
                                            value={newContact.ut2_article}
                                            onChange={e => setNewContact({...newContact, ut2_article: e.target.value})}
                                            placeholder="https://..."
                                        />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                                    <input 
                                        type="email" 
                                        className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
                                        value={newContact.email}
                                        onChange={e => setNewContact({...newContact, email: e.target.value})}
                                        placeholder="name@example.com"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">备注/策略</label>
                                    <textarea 
                                        className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none h-20 resize-none"
                                        value={newContact.note}
                                        onChange={e => setNewContact({...newContact, note: e.target.value})}
                                        placeholder="例如：发新闻稿即可，关注雷电4性能..."
                                    ></textarea>
                                </div>
                                <div className="pt-2">
                                    <button 
                                        type="submit"
                                        className="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 transition-colors"
                                    >
                                        {editingId ? '保存修改' : '确认添加'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    {/* Sidebar */}
                    <aside className="w-full md:w-64 bg-white border-r border-gray-200 flex-shrink-0">
                        <div className="p-6 border-b border-gray-100">
                            <h1 className="text-xl font-bold text-gray-900 tracking-tight">UP6 Launch <span className="text-blue-600">Hub</span></h1>
                            <p className="text-xs text-gray-500 mt-1">Media Relations Center</p>
                        </div>
                        <nav className="p-4 space-y-1">
                            <button 
                                onClick={() => setActiveTab('dashboard')}
                                className={`w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'dashboard' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}
                            >
                                <Icons.BarChart3 size={18} /> 总览 & 准备
                            </button>
                            <button 
                                onClick={() => setActiveTab('media')}
                                className={`w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'media' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}
                            >
                                <Icons.Users size={18} /> 媒体联络表
                            </button>
                            <button 
                                onClick={() => setActiveTab('templates')}
                                className={`w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg transition-colors ${activeTab === 'templates' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}
                            >
                                <Icons.Mail size={18} /> 邮件模板
                            </button>
                        </nav>
                        
                        <div className="p-4 mt-auto">
                            <div className="bg-blue-50 rounded-lg p-4">
                                <h4 className="text-xs font-bold text-blue-800 uppercase mb-2">执行 Tips</h4>
                                <p className="text-xs text-blue-600 leading-relaxed">
                                    务必记得将邮件模板中的 <strong>[Link]</strong> 替换为您实际的 Google Drive 链接。
                                </p>
                            </div>
                            <button onClick={resetData} className="mt-4 w-full flex items-center justify-center gap-2 text-xs text-gray-400 hover:text-red-500 transition-colors">
                                <Icons.RefreshCw size={12} /> 重置所有数据
                            </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto custom-scrollbar h-screen">
                        <header className="bg-white border-b border-gray-200 px-8 py-5 sticky top-0 z-10 shadow-sm md:hidden">
                             <h1 className="text-lg font-bold text-gray-900">UnifyDrive UP6 Launch</h1>
                        </header>
                        
                        <div className="p-4 md:p-8 w-full max-w-[1440px] mx-auto">
                            <div className="mb-8">
                                <h2 className="text-2xl font-bold text-gray-900 mb-2">
                                    {activeTab === 'dashboard' && '任务总览 & 准备'}
                                    {activeTab === 'media' && '媒体联络管理 (CRM)'}
                                    {activeTab === 'templates' && 'Pitch 邮件模板'}
                                </h2>
                                <ProgressBar progress={progress} />
                            </div>

                            <div className="animate-fade-in">
                                {activeTab === 'dashboard' && renderDashboard()}
                                {activeTab === 'media' && renderMediaList()}
                                {activeTab === 'templates' && renderTemplates()}
                            </div>
                        </div>
                    </main>
                    {renderAddMediaModal()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
